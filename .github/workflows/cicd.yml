name: CI/CD Pipeline

on:
  push:
    branches:
        - main
  pull_requests:
    branches:
        - main

jobs:
    build:
        name: Build and Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: checkout/action@v3
            - name: Build Docker Image
              run: docker build -t cicd-image .
            - name: Test Image
              run: docker run -d -p 8080:80 --name test-container cicd-image && sleep 5 && curl http://localhost:8080 && docker stop test-container && docker rm test-container
    
    push:
        name: Push Docker Image
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: checkout/action@v3
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{secrets.DOCKER_USERNAME}}
                password: ${{secrets.DOCKER_PASSWORD}}
            - name: Build Docker Image
              run: docker build -t ${{secrets.DOCKER_USERNAME}}/cicd-image .
            - name: Push Docker Image
              run: docker push ${{secrets.DOCKER_USERNAME}}/cicd-image 